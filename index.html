<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan Musholla Darun Najah</title>
    <!-- Library SheetJS untuk Fitur Download Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --accent: #81c784;
            --bg: #f4f7f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --danger: #d32f2f;
            --warning: #f57c00;
            --info: #0288d1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* Ringkasan Saldo Dashboard */
        .summary-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 220px;
            padding: 20px;
            border-radius: 10px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card-in { background-color: var(--primary-light); }
        .card-out { background-color: var(--danger); }
        .card-balance { background-color: var(--info); }

        .card h3 {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .card .amount {
            font-size: 22px;
            font-weight: bold;
        }

        /* Form Input Data */
        .form-container {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-bottom: 25px;
        }

        .form-container h3 {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: #124116; }

        .btn-success { background-color: #2e7d32; color: white; }
        .btn-success:hover { background-color: #1b5e20; }

        .btn-secondary { background-color: #757575; color: white; display: none; }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Tabel Data */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }

        tr:hover { background-color: #f1f8e9; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-masuk { background-color: #e8f5e9; color: #2e7d32; }
        .badge-keluar { background-color: #ffebee; color: #c62828; }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            margin-right: 3px;
        }

        .btn-edit { background-color: var(--warning); color: white; }
        .btn-delete { background-color: var(--danger); color: white; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .summary-grid { flex-direction: column; }
            .btn-group { width: 100%; }
            .btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Musholla Darun Najah</h1>
        <p>Sistem Laporan Keuangan & Rekapitulasi Infaq Bulanan</p>
    </div>

    <!-- Ringkasan Saldo Dashboard -->
    <div class="summary-grid">
        <div class="card card-in">
            <h3>Total Pemasukan</h3>
            <div class="amount" id="totalPemasukan">Rp 0</div>
        </div>
        <div class="card card-out">
            <h3>Total Pengeluaran</h3>
            <div class="amount" id="totalPengeluaran">Rp 0</div>
        </div>
        <div class="card card-balance">
            <h3>Saldo Akhir</h3>
            <div class="amount" id="saldoAkhir">Rp 0</div>
        </div>
    </div>

    <!-- Form Input / Edit Data -->
    <div class="form-container">
        <h3 id="formTitle">Tambah Transaksi Baru</h3>
        <form id="financeForm">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-grid">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Jenis Transaksi</label>
                    <select id="jenis" class="form-control" onchange="updateKategoriOptions()" required>
                        <option value="Pemasukan">Pemasukan (+)</option>
                        <option value="Pengeluaran">Pengeluaran (-)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="kategori" class="form-control" required>
                        <!-- Opsi diisi otomatis -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Keterangan</label>
                    <input type="text" id="keterangan" placeholder="Contoh: Infaq Jumat Minggu 1" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Nominal (Rp)</label>
                    <input type="number" id="nominal" placeholder="0" class="form-control" min="1" required>
                </div>
            </div>
            <div class="btn-group">
                <button type="button" id="btnCancel" class="btn btn-secondary" onclick="resetForm()">Batal</button>
                <button type="submit" id="btnSave" class="btn btn-primary">Simpan Transaksi</button>
            </div>
        </form>
    </div>

    <!-- Toolbar Export -->
    <div class="toolbar">
        <h3>Daftar Transaksi</h3>
        <button class="btn btn-success" onclick="exportToExcel()">
            📊 Download Laporan (XLSX)
        </button>
    </div>

    <!-- Tabel Data Transaksi -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Jenis</th>
                    <th>Kategori</th>
                    <th>Keterangan</th>
                    <th>Nominal (Rp)</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <!-- Data dimasukkan secara dinamis -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let financeData = JSON.parse(localStorage.getItem('darunNajahFinanceData')) || [];

    const kategoriPemasukan = [
        "Infaq Kotak Amal",
        "Infaq Anak Yatim",
        "Infaq Donatur",
        "Pemasukan Lain-lain"
    ];

    const kategoriPengeluaran = [
        "Operasional & Listrik/Air",
        "Kesejahteraan Marbot/Imam",
        "Kegiatan & Pengajian",
        "Pemeliharaan & Pembangunan",
        "Pengeluaran Lain-lain"
    ];

    function updateKategoriOptions() {
        const jenis = document.getElementById('jenis').value;
        const kategoriSelect = document.getElementById('kategori');
        kategoriSelect.innerHTML = '';

        const listKategori = jenis === 'Pemasukan' ? kategoriPemasukan : kategoriPengeluaran;
        listKategori.forEach(kat => {
            const opt = document.createElement('option');
            opt.value = kat;
            opt.innerText = kat;
            kategoriSelect.appendChild(opt);
        });
    }

    function formatRupiah(number) {
        return 'Rp ' + parseInt(number).toLocaleString('id-ID');
    }

    function renderData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        let totalMasuk = 0;
        let totalKeluar = 0;

        financeData.forEach((item, index) => {
            const nominal = parseFloat(item.nominal);
            if (item.jenis === 'Pemasukan') {
                totalMasuk += nominal;
            } else {
                totalKeluar += nominal;
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.tanggal}</td>
                <td><span class="badge ${item.jenis === 'Pemasukan' ? 'badge-masuk' : 'badge-keluar'}">${item.jenis}</span></td>
                <td><strong>${item.kategori}</strong></td>
                <td>${item.keterangan}</td>
                <td style="color: ${item.jenis === 'Pemasukan' ? '#2e7d32' : '#c62828'}; font-weight: bold;">
                    ${item.jenis === 'Pemasukan' ? '+' : '-'} ${formatRupiah(item.nominal)}
                </td>
                <td>
                    <button class="btn btn-sm btn-edit" onclick="editData(${index})">Edit</button>
                    <button class="btn btn-sm btn-delete" onclick="deleteData(${index})">Hapus</button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        const saldoAkhir = totalMasuk - totalKeluar;

        document.getElementById('totalPemasukan').innerText = formatRupiah(totalMasuk);
        document.getElementById('totalPengeluaran').innerText = formatRupiah(totalKeluar);
        document.getElementById('saldoAkhir').innerText = formatRupiah(saldoAkhir);

        localStorage.setItem('darunNajahFinanceData', JSON.stringify(financeData));
    }

    document.getElementById('financeForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const tanggal = document.getElementById('tanggal').value;
        const jenis = document.getElementById('jenis').value;
        const kategori = document.getElementById('kategori').value;
        const keterangan = document.getElementById('keterangan').value;
        const nominal = document.getElementById('nominal').value;
        const editIndex = document.getElementById('editIndex').value;

        if (editIndex === "-1") {
            financeData.push({ tanggal, jenis, kategori, keterangan, nominal });
        } else {
            financeData[editIndex] = { tanggal, jenis, kategori, keterangan, nominal };
        }

        resetForm();
        renderData();
    });

    function editData(index) {
        const item = financeData[index];
        document.getElementById('tanggal').value = item.tanggal;
        document.getElementById('jenis').value = item.jenis;
        
        updateKategoriOptions();
        document.getElementById('kategori').value = item.kategori;
        
        document.getElementById('keterangan').value = item.keterangan;
        document.getElementById('nominal').value = item.nominal;
        document.getElementById('editIndex').value = index;

        document.getElementById('formTitle').innerText = 'Edit Transaksi';
        document.getElementById('btnSave').innerText = 'Update Transaksi';
        document.getElementById('btnCancel').style.display = 'inline-block';
    }

    function deleteData(index) {
        if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
            financeData.splice(index, 1);
            renderData();
        }
    }

    function resetForm() {
        document.getElementById('financeForm').reset();
        document.getElementById('editIndex').value = "-1";
        document.getElementById('formTitle').innerText = 'Tambah Transaksi Baru';
        document.getElementById('btnSave').innerText = 'Simpan Transaksi';
        document.getElementById('btnCancel').style.display = 'none';
        
        document.getElementById('tanggal').valueAsDate = new Date();
        updateKategoriOptions();
    }

    // Fungsi Download Excel
    function exportToExcel() {
        if (financeData.length === 0) {
            alert('Belum ada data transaksi untuk diunduh!');
            return;
        }

        const excelData = [
            ["LAPORAN KEUANGAN MUSHOLLA DARUN NAJAH"],
            ["Tanggal Cetak: " + new Date().toLocaleDateString('id-ID')],
            [],
            ["No", "Tanggal", "Jenis", "Kategori", "Keterangan", "Nominal (Rp)"]
        ];

        let totalMasuk = 0;
        let totalKeluar = 0;

        financeData.forEach((item, index) => {
            const nom = parseFloat(item.nominal);
            if (item.jenis === 'Pemasukan') totalMasuk += nom;
            else totalKeluar += nom;

            excelData.push([
                index + 1,
                item.tanggal,
                item.jenis,
                item.kategori,
                item.keterangan,
                nom
            ]);
        });

        excelData.push([]);
        excelData.push(["", "", "", "", "Total Pemasukan", totalMasuk]);
        excelData.push(["", "", "", "", "Total Pengeluaran", totalKeluar]);
        excelData.push(["", "", "", "", "Saldo Akhir", totalMasuk - totalKeluar]);

        const ws = XLSX.utils.aoa_to_sheet(excelData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Laporan Keuangan");

        XLSX.writeFile(wb, "Laporan_Keuangan_Musholla_Darun_Najah.xlsx");
    }

    document.getElementById('tanggal').valueAsDate = new Date();
    updateKategoriOptions();
    renderData();
</script>

</body>
</html>
